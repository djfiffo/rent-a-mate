name: Quality gate

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_ACCESS_SECRET: test-access-secret-not-for-production
      JWT_REFRESH_SECRET: test-refresh-secret-not-for-production
      JWT_SOCKET_TICKET_SECRET: test-socket-ticket-secret-not-for-production
      SOCKET_TICKET_TTL_SECONDS: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
