services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: matefor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: matefor
    volumes:
      - matefor_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matefor -d matefor"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    volumes:
      - matefor_minio:/data

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://matefor:${POSTGRES_PASSWORD}@postgres:5432/matefor
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_SOCKET_TICKET_SECRET: ${JWT_SOCKET_TICKET_SECRET:?JWT_SOCKET_TICKET_SECRET is required}
      SOCKET_TICKET_TTL_SECONDS: ${SOCKET_TICKET_TTL_SECONDS:-60}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      # Production must use Stripe; the local payment mock is disabled by NODE_ENV.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?STRIPE_SECRET_KEY is required}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?STRIPE_WEBHOOK_SECRET is required}
      STRIPE_API_VERSION: ${STRIPE_API_VERSION:-2026-08-26.dahlia}
      PAYMENTS_MODE: stripe
      PORT: 3000
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: matefor
      MINIO_PUBLIC_URL: /api/v1/uploads
      DEMO_ACCOUNT_PASSWORD: ${DEMO_ACCOUNT_PASSWORD:?DEMO_ACCOUNT_PASSWORD is required}
    ports:
      - "192.168.1.161:3002:3000"

volumes:
  matefor_postgres:
  matefor_minio:
